name: Release FixAR Pack

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Build & validate FixAR pack archive
        run: npm run pack:validate
      - name: Attach pack archive and SHA-256 to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" fixar-pack/dist/*.tar.gz fixar-pack/dist/*.tar.gz.sha256 --clobber
          else
            gh release create "${TAG}" \
              fixar-pack/dist/*.tar.gz \
              fixar-pack/dist/*.tar.gz.sha256 \
              --title "Scenario-to-Cinema (${TAG}) — FixAR Pack cinema-rpg/book-to-film-rpg@0.1.0" \
              --generate-notes
          fi
