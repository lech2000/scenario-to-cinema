apiVersion: aios.dev/v1alpha1
kind: Pack

metadata:
  namespace: cinema-rpg
  name: book-to-film-rpg
  version: 0.2.0
  publisher: pub_cinema_rpg
  title: "Книга в кино: ИИ-ведущий дела и 3D-режиссёр"
  summary: >-
    Упрощённый голосовой и текстовый конвейер (4 шага с визуальной схемой дела):
    ведущий разъясняет каждый пункт плана, ведёт живую историю 2d6 с 3D-сценами
    на raea и выпускает озвученный мини-фильм с титрами после вашего согласия.
  license: MIT
  categories: [automation, integration, knowledge]
  keywords: [ttrpg, cinema, raea, story, video]

spec:
  compatibility:
    min_aios: 2.1.0

  reads_sensitivity: [normal]

  components:
    domains: [book-to-film-rpg]
    agents: [case-guide, game-master, showrunner]
    connectors:
      - name: cinema-engine-api
        type: http
        endpoint: https://joe.tail54a262.ts.net:10000/cinema-rpg
        endpoint_secret: CINEMA_ENGINE_API_KEY
        summary: >-
          Внешний асинхронный движок рендера 3D-превиза (raea), многоголосой
          озвучки (TTS) и облачной видеогенерации (V2V) по утверждённым шотам.

  requested_capabilities:
    - traces:aggregate
    - network:egress

  secrets:
    - name: CINEMA_ENGINE_API_KEY
      purpose: Ключ авторизации запросов дела во внешний Cinema Engine API
      required: true
    - name: CINEMA_ENGINE_ENDPOINT
      purpose: Пользовательский адрес внешнего Cinema Engine API при self-hosted развёртывании
      required: false

  resources:
    timeout_seconds: 30
    memory_mb: 128
    requests_per_minute: 20

  tests:
    fixtures: tests/
    evals: evals/
