apiVersion: aios.dev/v1alpha1
kind: Pack

metadata:
  namespace: cinema-rpg
  name: book-to-film-rpg
  version: 0.1.0
  publisher: pub_cinema_rpg
  title: "Книга в кино: ИИ-НРИ с 3D-режиссёром"
  summary: >-
    Превращает главу книги в соло-НРИ с живым 3D-превизом сцен на raea и
    собирает в финале художественный мини-фильм (2–5 мин) с многоголосым
    озвучиванием и видеогенерацией после утверждения аниматика.
  license: MIT
  categories: [automation, integration, knowledge]
  keywords: [ttrpg, cinema, raea, story, video]

spec:
  compatibility:
    min_aios: 2.1.0

  reads_sensitivity: [normal]

  components:
    domains: [book-to-film-rpg]
    agents: [world-builder, game-master, showrunner]
    connectors:
      - name: cinema-engine-api
        type: http
        endpoint: https://cinema-engine.example.com
        endpoint_secret: CINEMA_ENGINE_ENDPOINT
        summary: >-
          Внешний асинхронный движок рендера 3D-превиза (raea), многоголосой
          озвучки (TTS) и облачной видеогенерации (V2V) по утверждённым шотам.

  requested_capabilities:
    - traces:aggregate
    - network:egress

  secrets:
    - name: CINEMA_ENGINE_ENDPOINT
      purpose: Адрес внешнего Cinema Engine API для рендера 3D-превиза и финального видео
      required: true
    - name: CINEMA_ENGINE_API_KEY
      purpose: Ключ авторизации запросов дела во внешний Cinema Engine API
      required: true

  resources:
    timeout_seconds: 30
    memory_mb: 128
    requests_per_minute: 20

  tests:
    fixtures: tests/
    evals: evals/
